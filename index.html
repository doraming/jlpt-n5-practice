<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JLPT N5 實戰練習平台</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [questionsData, setQuestionsData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [score, setScore] = useState(0);

      // Fetch questions from external questions.json file
      useEffect(() => {
        fetch('questions.json')
          .then(response => {
            if (!response.ok) throw new Error('無法載入 questions.json');
            return response.json();
          })
          .then(data => {
            setQuestionsData(data);
            setLoading(false);
          })
          .catch(error => {
            console.error('Error loading questions:', error);
            setLoading(false);
          });
      }, []);

      if (loading) {
        return (
          <div className="flex items-center justify-center min-h-screen">
            <div className="text-center text-slate-500 font-medium">載入題庫中...</div>
          </div>
        );
      }

      if (questionsData.length === 0) {
        return (
          <div className="flex items-center justify-center min-h-screen">
            <div className="text-center text-rose-500 font-medium p-4 bg-rose-50 rounded-xl border border-rose-200">
              未能載入題目。如果您是直接雙擊開啟 HTML，請確認使用本地伺服器（如 Live Server）或將檔案部署至 GitHub Pages，以允許讀取 external JSON 檔案。
            </div>
          </div>
        );
      }

      const currentQ = questionsData[currentIndex];

      const handleSelect = (idx) => {
        if (isSubmitted) return;
        setSelectedOption(idx);
      };

      const handleSubmit = () => {
        if (selectedOption === null) return;
        setIsSubmitted(true);
        if (selectedOption === currentQ.answerIndex) {
          setScore(score + 1);
        }
      };

      const handleNext = () => {
        setSelectedOption(null);
        setIsSubmitted(false);
        if (currentIndex < questionsData.length - 1) {
          setCurrentIndex(currentIndex + 1);
        } else {
          alert(`練習完成！你的最終得分是：${score} / ${questionsData.length}`);
          setCurrentIndex(0);
          setScore(0);
        }
      };

      return (
        <div className="max-w-2xl mx-auto p-4 py-8">
          <header className="mb-6 text-center">
            <h1 className="text-2xl font-bold text-indigo-600">JLPT N5 實戰練習平台</h1>
            <p className="text-sm text-slate-500 mt-1">題目 {currentIndex + 1} / {questionsData.length}</p>
          </header>

          <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
            <div className="flex items-center justify-between mb-3">
              <span className="inline-block px-3 py-1 bg-indigo-50 text-indigo-700 text-xs font-semibold rounded-full">
                {currentQ.category}
              </span>
              <span className="text-xs text-slate-400">ID: {currentQ.id}</span>
            </div>
            
            <h2 className="text-xl font-medium text-slate-900 mb-6 leading-relaxed whitespace-pre-line">{currentQ.question}</h2>

            <div className="space-y-3">
              {currentQ.options.map((opt, idx) => {
                let btnStyle = "border-slate-200 hover:border-indigo-300 bg-white text-slate-700";
                if (selectedOption === idx) {
                  btnStyle = "border-indigo-600 bg-indigo-50 text-indigo-900 font-medium";
                }
                if (isSubmitted) {
                  if (idx === currentQ.answerIndex) {
                    btnStyle = "border-emerald-500 bg-emerald-50 text-emerald-900 font-medium";
                  } else if (selectedOption === idx && idx !== currentQ.answerIndex) {
                    btnStyle = "border-rose-500 bg-rose-50 text-rose-900 font-medium";
                  }
                }

                return (
                  <button
                    key={idx}
                    onClick={() => handleSelect(idx)}
                    disabled={isSubmitted}
                    className={`w-full text-left p-4 rounded-xl border-2 transition-all flex items-center justify-between ${btnStyle}`}
                  >
                    <span>{opt}</span>
                    <span className="w-6 h-6 rounded-full border border-slate-300 flex items-center justify-center text-xs text-slate-400">
                      {String.fromCharCode(65 + idx)}
                    </span>
                  </button>
                );
              })}
            </div>

            {isSubmitted && (
              <div className="mt-6 p-4 rounded-xl bg-slate-50 border border-slate-200 text-sm">
                <h3 className="font-bold text-slate-900 mb-1">詳細解析：</h3>
                <p className="text-slate-600 leading-relaxed whitespace-pre-line">{currentQ.explanation}</p>
              </div>
            )}
          </div>

          <div className="flex justify-between items-center">
            <div className="text-sm text-slate-500">
              目前得分：<span className="font-bold text-indigo-600">{score}</span>
            </div>
            {!isSubmitted ? (
              <button
                onClick={handleSubmit}
                disabled={selectedOption === null}
                className="px-6 py-3 bg-indigo-600 text-white font-medium rounded-xl hover:bg-indigo-700 disabled:opacity-50 transition-colors shadow-sm"
              >
                提交答案
              </button>
            ) : (
              <button
                onClick={handleNext}
                className="px-6 py-3 bg-indigo-600 text-white font-medium rounded-xl hover:bg-indigo-700 transition-colors shadow-sm"
              >
                下一題 →
              </button>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
