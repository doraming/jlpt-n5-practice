    function App() {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [score, setScore] = useState(0);

      const currentQ = questionsData[currentIndex];

      const handleSelect = (idx) => {
        if (isSubmitted) return;
        setSelectedOption(idx);
      };

      const handleSubmit = () => {
        if (selectedOption === null) return;
        setIsSubmitted(true);
        if (selectedOption === currentQ.answerIndex) {
          setScore(score + 1);
        }
      };

      const handleNext = () => {
        setSelectedOption(null);
        setIsSubmitted(false);
        if (currentIndex < questionsData.length - 1) {
          setCurrentIndex(currentIndex + 1);
        } else {
          alert(`練習完成！你的最終得分是：${score} / ${questionsData.length}`);
          setCurrentIndex(0);
          setScore(0);
        }
      };

      return (
        <div className="max-w-2xl mx-auto p-4 py-8">
          <header className="mb-6 text-center">
            <h1 className="text-2xl font-bold text-indigo-600">JLPT N5 實戰練習</h1>
            <p className="text-sm text-slate-500">題目 {currentIndex + 1} / {questionsData.length}</p>
          </header>

          <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
            <span className="inline-block px-3 py-1 bg-indigo-50 text-indigo-700 text-xs font-semibold rounded-full mb-3">
              {currentQ.category}
            </span>
            <h2 className="text-xl font-medium text-slate-900 mb-6">{currentQ.question}</h2>

            <div className="space-y-3">
              {currentQ.options.map((opt, idx) => {
                let btnStyle = "border-slate-200 hover:border-indigo-300 bg-white text-slate-700";
                if (selectedOption === idx) {
                  btnStyle = "border-indigo-600 bg-indigo-50 text-indigo-900 font-medium";
                }
                if (isSubmitted) {
                  if (idx === currentQ.answerIndex) {
                    btnStyle = "border-emerald-500 bg-emerald-50 text-emerald-900 font-medium";
                  } else if (selectedOption === idx && idx !== currentQ.answerIndex) {
                    btnStyle = "border-rose-500 bg-rose-50 text-rose-900 font-medium";
                  }
                }

                return (
                  <button
                    key={idx}
                    onClick={() => handleSelect(idx)}
                    disabled={isSubmitted}
                    className={`w-full text-left p-4 rounded-xl border-2 transition-all flex items-center justify-between ${btnStyle}`}
                  >
                    <span>{opt}</span>
                    <span className="w-6 h-6 rounded-full border border-slate-300 flex items-center justify-center text-xs text-slate-400">
                      {String.fromCharCode(65 + idx)}
                    </span>
                  </button>
                );
              })}
            </div>

            {isSubmitted && (
              <div className="mt-6 p-4 rounded-xl bg-slate-50 border border-slate-200 text-sm">
                <h3 className="font-bold text-slate-900 mb-1">詳細解析：</h3>
                <p className="text-slate-600 leading-relaxed">{currentQ.explanation}</p>
              </div>
            )}
          </div>

          <div className="flex justify-end gap-3">
            {!isSubmitted ? (
              <button
                onClick={handleSubmit}
                disabled={selectedOption === null}
                className="px-6 py-3 bg-indigo-600 text-white font-medium rounded-xl hover:bg-indigo-700 disabled:opacity-50 transition-colors"
              >
                提交答案
              </button>
            ) : (
              <button
                onClick={handleNext}
                className="px-6 py-3 bg-indigo-600 text-white font-medium rounded-xl hover:bg-indigo-700 transition-colors"
              >
                下一題 →
              </button>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
