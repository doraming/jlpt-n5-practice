<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JLPT N5 文法操練｜大家的日本語 第1–9課</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23fff'/%3E%3Ccircle cx='32' cy='32' r='22' fill='%23D9333F'/%3E%3Ctext x='32' y='42' font-size='26' text-anchor='middle' fill='%23fff' font-family='serif'%3E文%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --ink:#26221e;
    --ink-soft:#5c554d;
    --paper:#faf7f0;
    --paper-deep:#f1ece0;
    --line:#ddd5c7;
    --accent:#d9333f;
    --accent-deep:#b32831;
    --navy:#1f3a5f;
    --ok:#2e7d4f;
    --ok-bg:#e8f3ec;
    --ng:#c0392b;
    --ng-bg:#fbeae7;
    --serif:"Noto Serif JP","Yu Mincho","Hiragino Mincho ProN","MS PMincho","MS Mincho",serif;
    --sans:"PingFang TC","Microsoft JhengHei","Hiragino Sans","Noto Sans TC",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:var(--sans);
    background:var(--paper);
    background-image:radial-gradient(var(--paper-deep) 1px, transparent 1px);
    background-size:22px 22px;
    color:var(--ink);
    line-height:1.7;
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:16px 16px 64px;}
  .nav-top{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 4px 10px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:38px;height:38px;border-radius:10px;background:var(--accent);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-size:20px;font-weight:700;flex:none;
  }
  .brand-tt{font-size:15px;font-weight:700;line-height:1.3;}
  .brand-sub{font-size:11px;color:var(--ink-soft);}
  .home-link{
    font-size:13px;color:var(--ink-soft);background:none;border:none;cursor:pointer;
    padding:8px 12px;border-radius:8px;font-family:var(--sans);
  }
  .home-link:hover{background:var(--paper-deep);}
  .exam-tag{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12px;letter-spacing:.14em;color:var(--accent-deep);font-weight:700;
    padding-bottom:2px;
  }
  .exam-tag::before{content:"";width:18px;height:2px;background:var(--accent);}
  h1.page-tt{
    font-size:26px;line-height:1.35;margin:6px 0 8px;letter-spacing:.02em;
  }
  h1.page-tt .n5{
    font-family:var(--serif);color:var(--accent);
  }
  .lede{font-size:14px;color:var(--ink-soft);margin-bottom:20px;max-width:56ch;}
  /* ===== 首頁：模擬試卷入口 ===== */
  .mock-entry{
    background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:18px 18px 16px;margin-bottom:26px;
    box-shadow:0 1px 0 rgba(0,0,0,.03);
  }
  .mock-entry .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .mock-entry h2{font-size:17px;margin-bottom:2px;}
  .mock-entry p{font-size:13px;color:var(--ink-soft);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:none;cursor:pointer;font-family:var(--sans);font-weight:700;
    border-radius:10px;transition:transform .06s ease, box-shadow .12s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{
    background:var(--accent);color:#fff;font-size:15px;
    padding:12px 22px;box-shadow:0 2px 6px rgba(217,51,63,.28);
  }
  .btn-primary:hover{background:var(--accent-deep);}
  .btn-ghost{
    background:transparent;border:1.5px solid var(--line);color:var(--ink);
    font-size:14px;padding:10px 18px;
  }
  .btn-ghost:hover{border-color:var(--ink-soft);}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}
  /* ===== 課程卡片 ===== */
  .sec-tt{
    display:flex;align-items:baseline;gap:8px;margin:0 2px 10px;
  }
  .sec-tt h2{font-size:15px;font-weight:700;}
  .sec-tt span{font-size:12px;color:var(--ink-soft);}
  .lesson-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  @media(min-width:640px){.lesson-grid{grid-template-columns:repeat(3,1fr);}}
  .lesson-card{
    text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:14px 14px 12px;cursor:pointer;font-family:var(--sans);
    display:flex;flex-direction:column;gap:6px;min-height:44px;
    transition:border-color .12s ease, box-shadow .12s ease;
  }
  .lesson-card:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(217,51,63,.10);}
  .lc-head{display:flex;align-items:baseline;justify-content:space-between;gap:6px;}
  .lc-no{font-size:13px;font-weight:700;color:var(--accent-deep);letter-spacing:.06em;}
  .lc-theme{font-size:12px;color:var(--ink-soft);}
  .lc-points{font-size:13px;line-height:1.55;color:var(--ink);}
  .lc-pts{font-family:var(--serif);}
  .lc-meta{font-size:11px;color:var(--ink-soft);display:flex;justify-content:space-between;}
  .lc-best{color:var(--ok);font-weight:700;}
  .src-note{
    font-size:12px;color:var(--ink-soft);margin-top:26px;padding-top:14px;
    border-top:1px dashed var(--line);
  }
  /* ===== 測驗頁 ===== */
  .quiz-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-bottom:12px;flex-wrap:wrap;
  }
  .quiz-mode{font-size:12px;font-weight:700;color:var(--accent-deep);letter-spacing:.05em;}
  .quiz-prog{font-size:12px;color:var(--ink-soft);}
  .timer{
    font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;color:var(--navy);
    background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 10px;
  }
  .timer.overtime{color:var(--ng);border-color:var(--ng);}
  .progress-bar{height:4px;background:var(--paper-deep);border-radius:2px;overflow:hidden;margin-bottom:18px;}
  .progress-fill{height:100%;background:var(--accent);width:0;transition:width .25s ease;}
  .q-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 18px 18px;}
  .q-inst{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;line-height:1.6;}
  .q-tag{
    display:inline-block;font-size:11px;font-weight:700;color:var(--navy);
    background:#eef2f7;border-radius:6px;padding:2px 8px;margin-bottom:12px;
  }
  .q-text{
    font-family:var(--serif);font-size:20px;line-height:1.9;letter-spacing:.02em;
    margin-bottom:4px;
  }
  .q-hint{font-size:13px;color:var(--ink-soft);margin-bottom:14px;}
  .opt-list{display:grid;gap:10px;margin-top:14px;}
  .opt{
    display:flex;align-items:center;gap:12px;min-height:52px;
    background:#fff;border:1.5px solid var(--line);border-radius:10px;
    padding:10px 14px;cursor:pointer;font-family:var(--sans);text-align:left;
    font-size:16px;transition:border-color .1s ease, background .1s ease;
  }
  .opt:hover:not(.locked){border-color:var(--accent);}
  .opt .num{
    width:26px;height:26px;border-radius:50%;flex:none;
    border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;color:var(--ink-soft);
  }
  .opt.locked{cursor:default;}
  .opt.correct{border-color:var(--ok);background:var(--ok-bg);}
  .opt.correct .num{border-color:var(--ok);background:var(--ok);color:#fff;}
  .opt.wrong{border-color:var(--ng);background:var(--ng-bg);}
  .opt.wrong .num{border-color:var(--ng);background:var(--ng);color:#fff;}
  .opt .opt-body{font-family:var(--serif);font-size:17px;line-height:1.6;}
  .opt .opt-body .star{color:var(--accent);font-weight:700;}
  /* 並べ替え（排序題）*/
  .order-skeleton{
    font-family:var(--serif);font-size:19px;line-height:2.1;letter-spacing:.02em;
  }
  .order-skeleton .slot{
    display:inline-block;min-width:52px;border-bottom:2px solid var(--ink);
    text-align:center;color:var(--ink-soft);font-size:14px;font-weight:700;
